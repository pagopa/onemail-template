name: Sync templates

on:
    push:
        branches: [main]
        paths:
            - templates/**
    workflow_dispatch:
        inputs:
            environment:
                description: Environment to publish
                type: choice
                options: [dev, uat, prod]
                required: true

permissions: {}

jobs:
    changes:
        name: Prepare changed templates
        runs-on: ubuntu-22.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
            changed_files: ${{ steps.changes.outputs.all_changed_files }} # Added, copied, modified, and renamed template files
            deleted_files: ${{ steps.changes.outputs.deleted_files }} # All deleted template files
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 https://github.com/actions/checkout/releases/tag/v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Environment Matrix
              id: matrix
              uses: ./.github/action/env-matrix
              with:
                  event_name: ${{ github.event_name }}
                  environment_input: ${{ inputs.environment }}

            - name: Resolve first parent commit for change detection
              id: base
              shell: bash
              run: |
                  set -euo pipefail
                  # Compare against the commit immediately before this one.
                  base_sha=$(git rev-parse "$GITHUB_SHA^")
                  # Expose the base SHA to the next step.
                  printf 'sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

            - name: Detect changed templates
              id: changes
              uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5 https://github.com/tj-actions/changed-files/releases/tag/v47.0.5
              with:
                  base_sha: ${{ steps.base.outputs.sha }} # The commit immediately before the current one
                  sha: ${{ github.sha }} # The current commit SHA
                  files: templates/**/template.json
                  output_renamed_files_as_deleted_and_added: true
                  json: true
                  escape_json: false
                  safe_output: false
                  quotepath: false
                  skip_initial_fetch: true
                  fail_on_initial_diff_error: true

    synchronization:
        name: Sync templates - ${{ matrix.environment }}-${{ matrix.region }}
        needs: changes
        if: github.ref == 'refs/heads/main' && (needs.changes.outputs.changed_files != '[]' || needs.changes.outputs.deleted_files != '[]')
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
        environment: ${{ matrix.environment == 'prod' && format('{0}/{1}', matrix.environment, matrix.region) || matrix.environment }}
        concurrency:
            group: ses-templates-${{ matrix.environment }}-${{ matrix.region }}
            cancel-in-progress: false
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 https://github.com/actions/checkout/releases/tag/v4.3.1
              with:
                  persist-credentials: false

            - name: Configure AWS Credentials
              id: aws
              uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2 https://github.com/aws-actions/configure-aws-credentials/releases/tag/v4.0.2
              with:
                  role-to-assume: ${{ vars.IAM_ROLE_TEMPLATE_SYNC }}
                  aws-region: ${{ matrix.region }}

            - name: Synchronize changed and removed templates
              shell: bash
              env:
                  ENV_SHORT: ${{ fromJSON('{"dev":"d","uat":"u","prod":"p"}')[matrix.environment] }}
                  AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
                  AWS_TEMPLATE_DB_TABLE: ${{ vars.AWS_TEMPLATE_DB_TABLE }}
                  CHANGED_FILES: ${{ needs.changes.outputs.changed_files }}
                  DELETED_FILES: ${{ needs.changes.outputs.deleted_files }}
              run: |
                  set -euo pipefail
                  failed=false
                  mapfile -t files < <(jq -r '.[]' <<< "$CHANGED_FILES")
                  if [[ ${#files[@]} -gt 0 ]]; then
                    bash scripts/sync-ses-templates.sh -e "$ENV_SHORT" "${files[@]}" || failed=true
                  fi
                  mapfile -t deleted < <(jq -r '.[]' <<< "$DELETED_FILES")
                  if [[ ${#deleted[@]} -gt 0 ]]; then
                    bash scripts/sync-ses-templates.sh -e "$ENV_SHORT" -d "${deleted[@]}" || failed=true
                  fi
                  [[ $failed == false ]]
