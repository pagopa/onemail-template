name: Sync templates

on:
    push:
        branches: [main]
        paths:
            - templates/**
    workflow_dispatch:
        inputs:
            environment:
                description: Environment to publish
                type: choice
                options: [dev, uat, prod]
                required: true
            client:
                description: Client folder name under templates (for example ced)
                type: string
                required: true

permissions: {}

jobs:
    changes:
        name: Prepare templates to synchronize
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-22.04
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            matrix: ${{ steps.matrix.outputs.matrix }}
            files_to_publish: ${{ steps.selection.outputs.files_to_publish }}
            files_to_delete: ${{ steps.selection.outputs.files_to_delete }}
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 https://github.com/actions/checkout/releases/tag/v4.3.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Setup Environment Matrix
              id: matrix
              uses: ./.github/action/env-matrix
              with:
                  event_name: ${{ github.event_name }}
                  environment_input: ${{ inputs.environment }}

            - name: Resolve change base (first parent commit)
              # only for automatic run (push events)
              if: github.event_name == 'push'
              id: base
              shell: bash
              run: |
                  set -euo pipefail
                  # Compare against the commit immediately before this one.
                  base_sha=$(git rev-parse "$GITHUB_SHA^")
                  # Expose the base SHA to the next step.
                  printf 'sha=%s\n' "$base_sha" >> "$GITHUB_OUTPUT"

            - name: Detect changed templates
              # only for automatic run (push events)
              if: github.event_name == 'push'
              id: changes
              uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5 https://github.com/tj-actions/changed-files/releases/tag/v47.0.5
              with:
                  base_sha: ${{ steps.base.outputs.sha }} # The commit immediately before the current one
                  sha: ${{ github.sha }} # The current commit SHA
                  files: templates/**/template.json
                  output_renamed_files_as_deleted_and_added: true
                  json: true
                  escape_json: false
                  safe_output: false
                  quotepath: false
                  skip_initial_fetch: true
                  fail_on_initial_diff_error: true

            # Manual runs create or update all templates for the selected client; they never delete template resources.
            - name: Select client templates
              id: manual
              # only for manual run (workflow dispatch)
              if: github.event_name == 'workflow_dispatch'
              shell: bash
              env:
                  CLIENT: ${{ inputs.client }}
              run: |
                  set -euo pipefail
                  # Validate client name, preventing paths such as ../other-folder.
                  if [[ ! $CLIENT =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]]; then
                    echo '::error::Invalid client name.' >&2
                    exit 1
                  fi
                  if [[ -L templates || -L templates/$CLIENT || ! -d templates/$CLIENT ]]; then
                    printf '::error::Client folder does not exist.\n' >&2
                    exit 1
                  fi
                  # unmatched expression produces an empty array
                  shopt -s nullglob
                  files=("templates/$CLIENT/"*/*/template.json)
                  if [[ ${#files[@]} -eq 0 ]]; then
                    printf '::error::No template files found for this client.\n' >&2
                    exit 1
                  fi
                  selected=$(printf '%s\0' "${files[@]}" | jq -Rsc 'split("\u0000")[:-1]')
                  printf 'files=%s\n' "$selected" >> "$GITHUB_OUTPUT"

            - name: Prepare synchronization file lists
              id: selection
              shell: bash
              env:
                  MANUAL_FILES: ${{ steps.manual.outputs.files }}
                  CHANGED_FILES: ${{ steps.changes.outputs.all_changed_files }}
                  DELETED_FILES: ${{ steps.changes.outputs.deleted_files }}
              run: |
                  set -euo pipefail
                  if [[ $GITHUB_EVENT_NAME == 'workflow_dispatch' ]]; then
                    # Publish all templates for the selected client, without deletions.
                    files_to_publish=$MANUAL_FILES
                    files_to_delete='[]'
                  else
                    # Publish and delete only templates affected by the merged change.
                    files_to_publish=$CHANGED_FILES
                    files_to_delete=$DELETED_FILES
                  fi
                  echo "files_to_publish=$files_to_publish" >> "$GITHUB_OUTPUT"
                  echo "files_to_delete=$files_to_delete" >> "$GITHUB_OUTPUT"

    synchronization:
        name: Sync templates - ${{ matrix.environment }}-${{ matrix.region }}
        needs: changes
        if: github.ref == 'refs/heads/main' && (needs.changes.outputs.files_to_publish != '[]' || needs.changes.outputs.files_to_delete != '[]')
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
        environment: ${{ matrix.environment == 'prod' && format('{0}/{1}', matrix.environment, matrix.region) || matrix.environment }}
        concurrency:
            group: ses-templates-${{ matrix.environment }}-${{ matrix.region }}
            cancel-in-progress: false
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 https://github.com/actions/checkout/releases/tag/v4.3.1
              with:
                  persist-credentials: false

            - name: Configure AWS Credentials
              id: aws
              uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2 https://github.com/aws-actions/configure-aws-credentials/releases/tag/v4.0.2
              with:
                  role-to-assume: ${{ vars.IAM_ROLE_TEMPLATE_SYNC }}
                  aws-region: ${{ matrix.region }}

            - name: Synchronize changed and removed templates
              shell: bash
              env:
                  ENV_SHORT: ${{ fromJSON('{"dev":"d","uat":"u","prod":"p"}')[matrix.environment] }}
                  AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
                  AWS_TEMPLATE_DB_TABLE: ${{ vars.AWS_TEMPLATE_DB_TABLE }}
                  FILES_TO_PUBLISH: ${{ needs.changes.outputs.files_to_publish }}
                  FILES_TO_DELETE: ${{ needs.changes.outputs.files_to_delete }}
              run: |
                  set -euo pipefail
                  failed=false
                  mapfile -d '' -t files < <(jq -j '.[] | ., "\u0000"' <<< "$FILES_TO_PUBLISH")
                  if [[ ${#files[@]} -gt 0 ]]; then
                    bash scripts/sync-ses-templates.sh -e "$ENV_SHORT" "${files[@]}" || failed=true
                  fi
                  mapfile -d '' -t deleted < <(jq -j '.[] | ., "\u0000"' <<< "$FILES_TO_DELETE")
                  if [[ ${#deleted[@]} -gt 0 ]]; then
                    bash scripts/sync-ses-templates.sh -e "$ENV_SHORT" -d "${deleted[@]}" || failed=true
                  fi
                  [[ $failed == false ]]
