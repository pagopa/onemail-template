name: Validate templates

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  validate_templates:
    name: Template validation
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # Read feature branch templates from the PR commit; do not execute its validation scripts.
      - name: Checkout feature branch data
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 https://github.com/actions/checkout/releases/tag/v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: feature_checkout
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed template files
        id: changes
        uses: tj-actions/changed-files@22103cc46bda19c2b464ffe86db46df6922fd323 # v47.0.5 https://github.com/tj-actions/changed-files/releases/tag/v47.0.5
        with:
          path: feature_checkout
          base_sha: ${{ github.event.pull_request.base.sha }}
          sha: ${{ github.event.pull_request.head.sha }}
          files: templates/**
          output_renamed_files_as_deleted_and_added: true
          exclude_symlinks: false
          json: true
          escape_json: false
          safe_output: false
          quotepath: false
          skip_initial_fetch: true
          fail_on_initial_diff_error: true

      - name: Prepare template file lists
        id: selection
        shell: bash
        env:
          CHANGED_FILES: ${{ steps.changes.outputs.all_changed_files }}
          DELETED_FILES: ${{ steps.changes.outputs.deleted_files }}
          TYPE_CHANGED_FILES: ${{ steps.changes.outputs.type_changed_files }}
        run: |
          set -euo pipefail

          # Template paths to validate and sanitize (new and updated), excluding deletions.
          files_to_validate=$(jq -cn --argjson changed "$CHANGED_FILES" --argjson types "$TYPE_CHANGED_FILES" '$changed + $types | unique')
          # All template paths, including deletions.
          all_files=$(jq -cn --argjson files "$files_to_validate" --argjson deleted "$DELETED_FILES" '$files + $deleted | unique')
          
          echo "files_to_validate=$files_to_validate" >> "$GITHUB_OUTPUT"
          echo "all_files=$all_files" >> "$GITHUB_OUTPUT"

      # Run the trusted validator from the PR base, never scripts proposed by the PR.
      - name: Checkout main branch validator
        if: steps.selection.outputs.all_files != '[]'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 https://github.com/actions/checkout/releases/tag/v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: main_checkout
          sparse-checkout: scripts
          persist-credentials: false

      - name: Check single client scope
        if: steps.selection.outputs.all_files != '[]'
        shell: bash
        working-directory: feature_checkout
        env:
          FILES: ${{ steps.selection.outputs.all_files }}
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(jq -j '.[] | ., "\u0000"' <<< "$FILES")
          bash ../main_checkout/scripts/check-single-client.sh "${files[@]}"

      - name: Validate changed templates with main branch script
        if: steps.selection.outputs.files_to_validate != '[]'
        shell: bash
        working-directory: feature_checkout
        env:
          FILES: ${{ steps.selection.outputs.files_to_validate }}
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(jq -j '.[] | ., "\u0000"' <<< "$FILES")
          bash ../main_checkout/scripts/validate-templates.sh "${files[@]}" # Use main branch validator

      - name: Sanitize changed templates
        if: steps.selection.outputs.files_to_validate != '[]'
        shell: bash
        working-directory: feature_checkout
        env:
          FILES: ${{ steps.selection.outputs.files_to_validate }}
          SANITIZER_URL: ${{ secrets.SANITIZER_URL }}
        run: |
          set -euo pipefail
          mapfile -d '' -t files < <(jq -j '.[] | ., "\u0000"' <<< "$FILES")
          bash ../main_checkout/scripts/sanitize-templates.sh "${files[@]}" # Use main branch sanitization script
